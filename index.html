<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rothes Kochbuch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2512f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2b2622;--mut:#7a6f66;--acc:#c2512f;--on:#fff;--line:#e8dfd4;--font:Georgia,'Times New Roman',serif;--r:14px;--head:Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 var(--font);background:var(--bg);color:var(--ink);padding-bottom:76px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.head{font-family:var(--head)}
header{padding:18px 16px 10px}header h1{margin:0;font-size:26px;color:var(--acc)}
main{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap;font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:calc(var(--r) - 4px);padding:10px 14px;margin:2px 0}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
ul{list-style:none;padding:0;margin:0}li{padding:7px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}
li.done{text-decoration:line-through;color:var(--mut)}
h3{margin:14px 0 4px;font-size:15px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px;background:none;border:0;color:var(--mut);font-size:13px}nav button b{display:block;font-size:20px}nav button.on{color:var(--acc);font-weight:700}
.step{display:flex;align-items:center;gap:10px}.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);font-size:20px}
input[type=text],textarea,select{width:100%;padding:10px;border-radius:calc(var(--r) - 4px);border:1px solid var(--line);background:var(--card);margin:4px 0}
textarea{min-height:110px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.sw{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw button{border:2px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;background:var(--card)}
.sw button.on{border-color:var(--acc)}
.sw i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:3px;vertical-align:middle;border:1px solid #0002}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--bg);padding:12px;border-radius:12px;text-align:center;z-index:9}
.spin{opacity:.6;pointer-events:none}
.hero{width:100%;max-height:230px;object-fit:cover;border-radius:var(--r);margin-bottom:12px;display:block}
.thumb{width:62px;height:62px;border-radius:calc(var(--r) - 4px);object-fit:cover;flex:none}
#cook{position:fixed;inset:0;z-index:20;background:var(--bg);padding:16px;overflow:auto}
.cs{font-size:22px;line-height:1.5;margin:16px 0}
.tm{margin:8px 0;padding:8px 12px;border:1px solid var(--acc);border-radius:10px;background:var(--card)}
#tbar{position:fixed;top:0;left:0;right:0;z-index:15;padding:6px 12px;background:var(--bg);box-shadow:0 2px 8px #0003}#tbar .tm{margin:4px 0}
nav button{font-size:12px!important}
</style></head><body>
<header><h1>🍳 Rothes Kochbuch</h1></header>
<div id="chips" class="chips"></div>
<main id="main"></main>
<nav>
<button data-t="list"><b>📖</b>Rezepte</button><button data-t="week"><b>📅</b>Woche</button><button data-t="shop"><b>🛒</b>Einkauf</button>
<button data-t="find"><b>💡</b>Ideen</button><button data-t="add"><b>＋</b>Neu</button><button data-t="more"><b>⚙️</b>Mehr</button></nav>
<script>
/* ---------- Themes (10 Layouts) ---------- */
const THEMES={
 creme:{n:"Crème Klassik",bg:"#faf6f0",card:"#ffffff",ink:"#2b2622",mut:"#7a6f66",acc:"#c2512f",line:"#e8dfd4",font:"Georgia,serif",head:"Georgia,serif",r:"14px"},
 mint:{n:"Frisches Mint",bg:"#eef7f3",card:"#ffffff",ink:"#17332b",mut:"#5d7f74",acc:"#1f9d7a",line:"#d3e9e0",font:"system-ui,sans-serif",head:"system-ui,sans-serif",r:"18px"},
 rose:{n:"Rosé Café",bg:"#fdf1f0",card:"#fffafa",ink:"#4a2c2f",mut:"#9a7478",acc:"#d6597a",line:"#f3d9db",font:"'Trebuchet MS',sans-serif",head:"Georgia,serif",r:"22px"},
 nacht:{n:"Nachtküche",bg:"#17151a",card:"#232029",ink:"#f1ecf5",mut:"#a79fb3",acc:"#f2a65a",line:"#38333f",on:"#1b1410",font:"system-ui,sans-serif",head:"system-ui,sans-serif",r:"14px"},
 toskana:{n:"Toskana",bg:"#f6ecd9",card:"#fbf5e8",ink:"#3b2a1a",mut:"#8a6e4e",acc:"#a8431f",line:"#e3d0ac",font:"'Palatino Linotype',Palatino,serif",head:"'Palatino Linotype',Palatino,serif",r:"6px"},
 ozean:{n:"Ozean",bg:"#eaf3fb",card:"#ffffff",ink:"#12293d",mut:"#5a7690",acc:"#1e6fb8",line:"#cfe0ef",font:"system-ui,sans-serif",head:"system-ui,sans-serif",r:"12px"},
 lavendel:{n:"Lavendel",bg:"#f3f0fa",card:"#ffffff",ink:"#2d2745",mut:"#7a7396",acc:"#7a56d6",line:"#e2dcf2",font:"'Segoe UI',system-ui,sans-serif",head:"Georgia,serif",r:"20px"},
 retro:{n:"Retro 70er",bg:"#f4e3b5",card:"#fff4d1",ink:"#3a2412",mut:"#8b6a3d",acc:"#d9541e",line:"#e0c27f",font:"'Courier New',monospace",head:"'Courier New',monospace",r:"4px"},
 beere:{n:"Beerenrot",bg:"#fbeff3",card:"#ffffff",ink:"#3c1626",mut:"#92607a",acc:"#a3153f",line:"#f0d3de",font:"system-ui,sans-serif",head:"Georgia,serif",r:"16px"},
 wald:{n:"Wald & Papier",bg:"#e9ece3",card:"#f7f8f3",ink:"#222b1f",mut:"#6a7a63",acc:"#3f6b34",line:"#d3dac8",font:"'Gill Sans',Calibri,sans-serif",head:"'Gill Sans',Calibri,sans-serif",r:"2px"}
};
function applyTheme(){const t=THEMES[S.theme]||THEMES.creme,s=document.documentElement.style;
 ["bg","card","ink","mut","acc","line","font","head","r"].forEach(k=>s.setProperty("--"+k,t[k]));s.setProperty("--on",t.on||"#fff")}

/* ---------- Daten ---------- */
const SEED=[{id:1,titel:"Quiche Lorraine – der Klassiker",kat:["Hauptgericht","Backen"],por:4,aktiv:25,gesamt:60,
 naehr:"881 kcal · 21 g Eiweiß · 67 g Fett · 51 g KH pro Portion",quelle:"Chefkoch (Screenshot)",
 zutaten:[{g:"Mürbeteig",m:250,e:"g",n:"Mehl"},{g:"Mürbeteig",m:160,e:"g",n:"Butter (eiskalt)"},{g:"Mürbeteig",m:1,e:"",n:"Ei"},{g:"Mürbeteig",m:null,e:"",n:"Salz (1 Prise)"},{g:"Mürbeteig",m:null,e:"",n:"Mehl für die Arbeitsfläche"},
 {g:"Belag",m:100,e:"g",n:"Speckwürfel"},{g:"Belag",m:15,e:"g",n:"Butter zum Braten"},{g:"Belag",m:1,e:"",n:"Zwiebel"},{g:"Belag",m:1,e:"",n:"Porreestange"},{g:"Belag",m:4,e:"",n:"Ei (groß)"},{g:"Belag",m:250,e:"ml",n:"Sahne"},{g:"Belag",m:null,e:"",n:"Pfeffer (1 Prise)"}],
 schritte:["Mehl auf die Arbeitsfläche häufen, in der Mitte eine Mulde eindrücken und das Ei hineingeben. Eiskalte Butter in Flocken in die Mulde geben, Salz dazu. Alles schnell zu einem Teig kneten, in Frischhaltefolie wickeln und 30 Min. kalt stellen.",
 "Backofen auf 180 °C Ober-/Unterhitze vorheizen. Speck in etwas Butter anbraten. Porree in feine Ringe schneiden, Zwiebel würfeln, beides zum Speck geben.",
 "Teig ausrollen, in die gefettete Quicheform (28–30 cm) drücken, mit Gabel einstechen. Speck-Gemüse verteilen. Eier und Sahne verquirlen, mit Pfeffer würzen, darübergießen.",
 "Ca. 35 Min. im Ofen backen."],
 var:{veg:{titel:"Quiche Lorraine (vegetarisch)",hinweis:"Räuchertofu in etwas Öl knusprig braten; 1 TL geräuchertes Paprikapulver für das Raucharoma.",
  zutaten:null,ersetze:{"Speckwürfel":"Räuchertofu, gewürfelt"}}}}];
const K="kochbuch-v2",VER="2026-10-18 · Timer 2";
let S=Object.assign({rez:SEED,shop:[],faktor:{},theme:"creme",key:"",model:"mistral-small-latest",gh:"",ghRepo:"",meta:{},tomb:{},catsMeta:{h:"",u:0},syncAt:0,syncSt:"",plan:{n:5,days:[],wish:"",neu:true}},JSON.parse(localStorage.getItem(K)||"{}"));
const rawSave=()=>localStorage.setItem(K,JSON.stringify(S));
const save=()=>{rawSave();schedSync()};
const DEFCATS=["Hauptgericht","Suppe","Salat","Beilage","Dessert","Backen","Frühstück","Snack","Getränk"];
function ensureCats(){const a=Array.isArray(S.cats)?S.cats:[...DEFCATS];S.rez.forEach(r=>(r.kat||[]).forEach(c=>{if(!a.includes(c))a.push(c)}));S.cats=a}
ensureCats();
let tab="list",kat="Alle",cur=null,sel="orig",busy=false,editCat=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>Math.round(x*100)/100;
const STILE={veg:"🌱 Vegetarisch",indisch:"🍛 Indisch",asiatisch:"🥢 Asiatisch",italienisch:"🍝 Italienisch",mexikanisch:"🌮 Mexikanisch",orientalisch:"🧆 Orientalisch",deftig:"🥔 Deftig-deutsch",leicht:"🥗 Leicht & kalorienarm"};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- Mistral ---------- */
async function ai(content,json=true){
 if(!S.key){toast("Bitte erst den Mistral-Key unter „Mehr“ eintragen.");throw new Error("nokey")}
 const r=await fetch("https://api.mistral.ai/v1/chat/completions",{method:"POST",
  headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.key},
  body:JSON.stringify({model:S.model,temperature:.3,messages:[{role:"user",content}],...(json?{response_format:{type:"json_object"}}:{})})});
 if(!r.ok){const t=await r.text();throw new Error("Mistral "+r.status+": "+t.slice(0,200))}
 const j=await r.json();return json?JSON.parse(j.choices[0].message.content):j.choices[0].message.content}
const SCHEMA=`Antworte NUR als JSON: {"titel":string,"kat":[string] (z.B. Hauptgericht, Suppe, Salat, Dessert, Backen, Frühstück, Beilage),"por":number,"aktiv":number (Min),"gesamt":number (Min),"naehr":string,"zutaten":[{"g":Gruppenname oder "","m":number oder null,"e":Einheit oder "","n":Name}],"schritte":[string],"bild":{"abschnitt":number,"x":number,"y":number,"w":number,"h":number} oder null,"zeiten":[[{"l":string,"min":number}]]}. zeiten hat pro Schritt eine Liste (gleich viele Einträge wie schritte, [] wenn nichts abzuwarten ist) mit Warte-/Garzeiten (Ofen, Kochen, Braten, Ruhen, Kühlen, Gehen lassen): l = kurze Bezeichnung wie "Ofen: Quiche backen", min = Minuten (bei Zeitspannen die obere Grenze, Stunden umrechnen). Mengen als Zahl, Einheit getrennt (g, ml, EL, TL, Stk …). Prisen/„etwas“ -> m:null und in den Namen schreiben.`;
function loadImg(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)})}
async function slices(f){ // lange Screenshots verkleinern und in Abschnitte schneiden
 const im=await loadImg(f),W=Math.min(800,im.width),sc=W/im.width,H=Math.round(im.height*sc),SH=1600,out=[];
 for(let y=0;y<H;y+=SH-100){const h=Math.min(SH,H-y),c=document.createElement("canvas");c.width=W;c.height=h;
  c.getContext("2d").drawImage(im,0,y/sc,im.width,h/sc,0,0,W,h);out.push(c.toDataURL("image/jpeg",.72));if(y+h>=H)break}
 return out}
async function importFiles(files){
 if(busy||!files.length)return;busy=true;$("#imp").classList.add("spin");$("#impst").textContent="Bild wird gelesen …";
 try{for(const f of files){const sl=await slices(f);
  $("#impst").textContent="KI liest Rezept ("+sl.length+" Abschnitte) …";
  const r=await ai([{type:"text",text:"Die Bilder sind aufeinanderfolgende Abschnitte EINES Screenshots einer Rezeptseite (App/Website). Ignoriere Werbung, Kommentare und Menüs. Übernimm das Rezept auf Deutsch, Mengen so wie angezeigt (Portionszahl der Seite). Falls Nährwerte angezeigt werden, schreibe sie in naehr. Vorhandene Kategorien: "+S.cats.join(", ")+". Wähle 1 bis 2 passende; nur wenn keine passt, schlage eine neue vor. Für bild: Rahmen als Anteile 0 bis 1 relativ zum jeweiligen Abschnitt (abschnitt 0 = erstes Bild) um das größte Foto des fertigen Gerichts, ohne Werbung; null, wenn keins sichtbar ist. "+SCHEMA},...sl.map(u=>({type:"image_url",image_url:u}))]);
  const bb=r.bild;delete r.bild;try{if(bb)r.img=await cropImg(sl,bb)}catch(e){}
  r.id=Date.now()+Math.floor(Math.random()*999);r.var={};r.quelle="Screenshot-Import";r.kat=normCats(r.kat?.length?r.kat:["Hauptgericht"]);S.rez.unshift(r);save();toast("Importiert: "+r.titel)}
  tab="list";kat="Alle";cur=S.rez[0].id;sel="orig";editCat=cur}catch(e){if(e.message!=="nokey")alert("Import fehlgeschlagen: "+e.message)}
 busy=false;render()}
async function makeVariant(id,typ){const r=S.rez.find(x=>x.id===id);if(busy)return;busy=true;render();
 const anw=typ==="veg"?"Wandle das Rezept in eine vollwertige VEGETARISCHE Variante um (Fleisch/Fisch sinnvoll ersetzen, Würzung anpassen).":"Wandle das Rezept in eine "+STILE[typ].replace(/^\S+\s/,"")+" Variante um (typische Gewürze, Zutaten und Techniken).";
 try{const v=await ai(anw+" Behalte die Portionszahl "+r.por+". Das Original: "+JSON.stringify({titel:r.titel,por:r.por,zutaten:r.zutaten,schritte:r.schritte})+"\n"+SCHEMA+' Zusätzlich "hinweis": kurzer Tipp (1-2 Sätze).');
  r.var=r.var||{};r.var[typ]=v;save();sel=typ}catch(e){if(e.message!=="nokey")alert("Variante fehlgeschlagen: "+e.message)}
 busy=false;render()}
async function ideas(mode){const q=($("#q")?.value||"").trim();if(busy)return;if(mode==="zut"&&!q)return toast("Erst Zutaten eintippen");
 busy=true;$("#ideas").innerHTML="<span class=mut>KI überlegt …</span>";
 try{const own=S.rez.slice(0,15).map(r=>r.titel).join(", ");
  const J=' Antworte NUR als JSON: {"ideen":[{"titel":string,"satz":string}]} (satz: ein Satz, was das Gericht ausmacht).';
  const v=await ai(mode==="zut"?"Ich habe diese Zutaten: "+q+". Schlage 5 passende Gerichte vor (Grundzutaten wie Salz, Öl, Mehl dürfen fehlen)."+J:"Überrasche mich mit 3 Gerichten, die zu meinem Geschmack passen (meine Rezepte: "+own+"). Gern andere Küche als sonst."+J);
  window.IDEAS=v.ideen||[];$("#ideas").innerHTML=IDEAS.map((x,i)=>`<div class="card"><b>${esc(x.titel)}</b><div class="mut">${esc(x.satz)}</div><button class="btn ghost" onclick="genIdea(${i})">✨ Als Rezept speichern</button></div>`).join("")}
 catch(e){$("#ideas").innerHTML="";if(e.message!=="nokey")alert(e.message)}busy=false}
async function generateRecipe(t){const r=await ai('Erzeuge ein vollständiges, alltagstaugliches Rezept für "'+t+'" für 4 Portionen. Setze bild auf null. Vorhandene Kategorien: '+S.cats.join(', ')+' (passende wählen, sonst neue). '+SCHEMA);
 delete r.bild;r.id=Date.now()+Math.floor(Math.random()*999);r.var={};r.quelle="KI-Idee";r.kat=normCats(r.kat?.length?r.kat:["Hauptgericht"]);S.rez.unshift(r);save();return r}
async function genIdea(i){if(busy)return;busy=true;toast("Rezept wird erstellt …");
 try{const r=await generateRecipe(IDEAS[i].titel);cur=r.id;sel="orig";tab="list"}catch(e){if(e.message!=="nokey")alert("Fehlgeschlagen: "+e.message)}busy=false;render()}

/* ---------- Ansichten ---------- */
function current(r){if(sel==="orig"||!r.var?.[sel])return r;const v=r.var[sel];
 const z=v.zutaten||r.zutaten.map(z=>({...z,n:v.ersetze?.[z.n]||z.n}));
 return {...r,titel:v.titel||r.titel,zutaten:z,schritte:v.schritte||r.schritte,zeiten:v.schritte?v.zeiten:r.zeiten,hinweis:v.hinweis}}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const used=new Set(S.rez.flatMap(r=>r.kat||[])),cats=["Alle","★ Favoriten",...S.cats.filter(c=>used.has(c)),...(S.rez.some(r=>!(r.kat||[]).length)?["Ohne Kategorie"]:[])];
 $("#chips").style.display=tab==="list"&&!cur?"flex":"none";
 $("#chips").innerHTML=cats.map(c=>`<button class="chip ${c===kat?"on":""}" data-c="${esc(c)}" onclick="kat=this.dataset.c;render()">${esc(c)}</button>`).join("");
 const m=$("#main");
 if(tab==="list")m.innerHTML=cur?detail(S.rez.find(r=>r.id===cur)):(S.rez.filter(r=>kat==="Alle"||(kat==="★ Favoriten"?r.fav:kat==="Ohne Kategorie"?!(r.kat||[]).length:(r.kat||[]).includes(kat))).map(r=>`<div class="card" onclick="cur=${r.id};sel='orig';render()"><div class="row" style="justify-content:flex-start;gap:12px">${r.img?`<img class="thumb" src="${r.img}">`:""}<div style="flex:1"><div class="row"><b class="head">${esc(r.titel)}</b><span>${r.fav?"★":""}</span></div><div class="mut">${esc((r.kat||[]).join(" · "))} · ${r.aktiv||"?"} Min. aktiv${(r.cooked||[]).length?" · "+r.cooked.length+"× gekocht":""}</div></div></div></div>`).join("")||"<p class=mut>Keine Rezepte.</p>");
 if(tab==="shop")m.innerHTML=shopView();
 if(tab==="week")m.innerHTML=weekView();
 if(tab==="find")m.innerHTML=`<div class="card"><b class="head">Was ist im Haus?</b><input type="text" id="q" placeholder="Zutaten, mit Komma getrennt (z. B. Ei, Sahne, Mehl)" oninput="finde()"><div id="res" style="margin-top:8px"></div><button class="btn ghost" onclick="ideas('zut')">✨ Ideen aus diesen Zutaten (KI)</button></div><div class="card"><b class="head">🎲 Überrasch mich</b><p><button class="btn" onclick="surprise()">Aus meinem Kochbuch</button> <button class="btn ghost" onclick="ideas('sur')">✨ Neu von der KI</button></p><div id="sur"></div></div><div id="ideas"></div>`;
 if(tab==="add")m.innerHTML=addView();
 if(tab==="more")m.innerHTML=moreView();
}
function detail(r0){const r=current(r0);const f=S.faktor[r0.id]||r0.por,k=f/r0.por;
 const groups=[...new Set(r.zutaten.map(z=>z.g||""))];
 const vars=Object.keys(STILE);
 return `<p class="row"><button class="btn ghost" onclick="cur=null;render()">← Zurück</button><span><button class="btn ghost" onclick="fav(${r0.id})">${r0.fav?"★":"☆"}</button> <button class="btn ghost" onclick="del(${r0.id})">🗑</button></span></p>
 ${r0.img?`<img class="hero" src="${r0.img}">`:""}<div class="card"><h2 style="margin:0 0 4px">${esc(r.titel)}</h2><div class="mut">${r0.aktiv||"?"} Min. aktiv · ${r0.gesamt||"?"} Min. gesamt</div>${r0.naehr?`<div class="mut">${esc(r0.naehr)}</div>`:""}${r0.quelle?`<div class="mut">Quelle: ${esc(r0.quelle)}</div>`:""}</div>
 <div class="card"><div class="row"><span class="mut">🏷 ${(r0.kat||[]).map(esc).join(" · ")||"Ohne Kategorie"}</span><button class="btn ghost" onclick="editCat=editCat===${r0.id}?null:${r0.id};render()">${editCat===r0.id?"Fertig":"ändern"}</button></div>${editCat===r0.id?catPicker(r0):""}</div>
 <div class="card"><div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn" onclick="cookStart(${r0.id})">👩‍🍳 Kochmodus</button><button class="btn ghost" onclick="cooked(${r0.id})">✓ Gekocht</button><button class="btn ghost" onclick="aiTimesBtn(${r0.id})">⏱ Zeiten per KI</button><label class="btn ghost" style="margin:2px 0">📷 Foto<input type="file" accept="image/*" hidden onchange="setPhoto(${r0.id},this.files[0])"></label>${r0.img?`<button class="btn ghost" onclick="S.rez.find(x=>x.id===${r0.id}).img=null;save();render()">Foto ✕</button>`:""}</div><div class="row" style="margin-top:6px"><span>${[1,2,3,4,5].map(n=>`<span onclick="setStars(${r0.id},${n})" style="font-size:26px;cursor:pointer;color:var(--acc)">${(r0.stars||0)>=n?"★":"☆"}</span>`).join("")}</span><span class="mut">${(r0.cooked||[]).length?(r0.cooked.length+"× gekocht · zuletzt "+new Date(r0.cooked[r0.cooked.length-1]).toLocaleDateString("de-DE")):"noch nicht gekocht"}</span></div></div>

function catPicker(r){return `<div style="margin-top:8px">${S.cats.map(c=>`<label style="display:block;padding:4px 0"><input type="checkbox" ${(r.kat||[]).includes(c)?"checked":""} data-c="${esc(c)}" onchange="toggleCat(${r.id},this.dataset.c)"> ${esc(c)}</label>`).join("")}<div class="row"><input type="text" id="nc" placeholder="Neue Kategorie"><button class="btn" onclick="addCat($('#nc').value,${r.id})">＋</button></div></div>`}
function toggleCat(id,c){const r=S.rez.find(x=>x.id===id);r.kat=r.kat||[];r.kat=r.kat.includes(c)?r.kat.filter(x=>x!==c):[...r.kat,c];save();render()}
function addCat(n,id){n=(n||"").trim();if(!n)return;const ex=S.cats.find(c=>c.toLowerCase()===n.toLowerCase());const c=ex||n;if(!ex)S.cats.push(c);
 if(id){const r=S.rez.find(x=>x.id===id);r.kat=r.kat||[];if(!r.kat.includes(c))r.kat.push(c)}save();render()}
function renameCat(c){const n=(prompt("Neuer Name für „"+c+"“:",c)||"").trim();if(!n||n===c)return;
 const ex=S.cats.find(x=>x.toLowerCase()===n.toLowerCase()&&x!==c);const t=ex||n;
 S.cats=S.cats.map(x=>x===c?t:x).filter((x,i,a)=>a.indexOf(x)===i);
 S.rez.forEach(r=>{if((r.kat||[]).includes(c))r.kat=[...new Set(r.kat.map(x=>x===c?t:x))]});if(kat===c)kat="Alle";save();render()}
function delCat(c){const n=S.rez.filter(r=>(r.kat||[]).includes(c)).length;if(!confirm("Kategorie „"+c+"“ löschen?"+(n?" Sie wird von "+n+" Rezept(en) entfernt, die Rezepte bleiben erhalten.":"")))return;
 S.cats=S.cats.filter(x=>x!==c);S.rez.forEach(r=>{r.kat=(r.kat||[]).filter(x=>x!==c)});if(kat===c)kat="Alle";save();render()}
function moveCat(c,d){const i=S.cats.indexOf(c),j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();render()}
function normCats(l){return(l||[]).map(c=>{c=String(c).trim();const ex=S.cats.find(x=>x.toLowerCase()===c.toLowerCase());if(!ex&&c)S.cats.push(c);return ex||c}).filter(Boolean)}

function addShop(id,useSel){const r0=S.rez.find(r=>r.id===id),r=useSel?current(r0):r0,f=(S.faktor[id]||r0.por)/r0.por;

  const hit=mm!=null&&S.shop.find(x=>!x.d&&x.n===z.n&&x.e===z.e&&x.m!=null);
  if(hit){hit.m+=mm;hit.t=fmt(hit.m)+" "+z.e+" "+z.n}
  else S.shop.push({n:z.n,e:z.e,m:mm,t:(mm!=null?fmt(mm)+" "+z.e+" ":"")+z.n})});
}

function cropImg(sl,b){return new Promise((res,rej)=>{const i=Math.max(0,Math.min(sl.length-1,Math.round(b.abschnitt||0))),im=new Image();
 im.onload=()=>{const x=+b.x,y=+b.y,w=+b.w,h=+b.h;if(!(w>.15&&h>.08&&x>=0&&y>=0&&x+w<=1.02&&y+h<=1.02))return rej();
  const sx=x*im.width,sy=y*im.height,sw=Math.min(w*im.width,im.width-sx),sh=Math.min(h*im.height,im.height-sy),W=Math.min(480,sw),c=document.createElement("canvas");
  c.width=W;c.height=Math.round(W*sh/sw);c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};
 im.onerror=rej;im.src=sl[i]})}
async function setPhoto(id,f){if(!f)return;const im=await loadImg(f),W=Math.min(480,im.width),H=Math.round(W*3/4),c=document.createElement("canvas");c.width=W;c.height=H;
 const sc=Math.max(W/im.width,H/im.height),dw=im.width*sc,dh=im.height*sc;c.getContext("2d").drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);

/* ---------- Kochmodus ---------- */
let cook=null,timers=[],wl=null;
async function cookStart(id){cook={id,i:0,ing:false};try{wl=await navigator.wakeLock?.request("screen")}catch(e){}cookRender()}
function cookEnd(){cook=null;try{wl?.release()}catch(e){}wl=null;cookRender()}
function cookDone(){const r=S.rez.find(x=>x.id===cook.id);r.cooked=[...(r.cooked||[]),Date.now()];save();cookEnd();toast("Guten Appetit! 🍽");render()}
function stepTimers(r,i){const z=r.zeiten&&r.zeiten[i];if(Array.isArray(z))return z.filter(x=>x&&x.min>0);
 const out=[],re=/(\d+)(?:\s*[–-]\s*(\d+))?\s*(Min\.?|Minuten|Std\.?|Stunden?)/gi;let m;while((m=re.exec(r.schritte[i]))){out.push({l:m[0],min:+(m[2]||m[1])*(/^S/i.test(m[3])?60:1)})}return out}
const tsave=()=>{try{localStorage.setItem("kochbuch-timers",JSON.stringify(timers))}catch(e){}};
try{timers=JSON.parse(localStorage.getItem("kochbuch-timers")||"[]")}catch(e){}
function addTimer(label,min){min=parseFloat(String(min).replace(",","."));if(!(min>0))return toast("Minuten eintragen");timers.push({end:Date.now()+min*60000,label:label||"Timer",done:false});tsave();cookRender()}
function timerStart(j){const t=stepTimers(cur_(),cook.i)[j];addTimer(t.l,$("#tmin"+j).value)}
function timerAll(){stepTimers(cur_(),cook.i).forEach((t,j)=>{const m=parseFloat(String($("#tmin"+j).value).replace(",","."));if(m>0)timers.push({end:Date.now()+m*60000,label:t.l,done:false})});tsave();cookRender()}
const cur_=()=>current(S.rez.find(x=>x.id===cook.id));
const mmss=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
function timersHtml(){return timers.map((t,i)=>`<div class="tm row"><span>⏱ ${esc(t.label)}: <b>${t.done?"⏰ abgelaufen":mmss(Math.max(0,Math.round((t.end-Date.now())/1000)))}</b></span><span>${t.done?"":`<button class="chip" onclick="timers[${i}].end+=300000;tsave();cookRender()">+5</button> `}<button class="chip" onclick="timers.splice(${i},1);tsave();cookRender()">✕</button></span></div>`).join("")}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2)})}catch(e){}try{navigator.vibrate?.([300,150,300,150,300])}catch(e){}}
function tick(){timers.forEach(t=>{if(!t.done&&Date.now()>=t.end){t.done=true;tsave();beep();toast("⏰ "+t.label+" ist um!")}});
 const e=document.getElementById("tms");if(cook&&e)e.innerHTML=timersHtml();
 let b=document.getElementById("tbar");if(!timers.length||cook){b&&b.remove();return}
 if(!b){b=document.createElement("div");b.id="tbar";document.body.appendChild(b)}b.innerHTML=timersHtml()}
setInterval(tick,1000);
async function timesFor(id,variantKey){const r0=S.rez.find(x=>x.id===id),useV=variantKey&&variantKey!=="orig"&&r0.var?.[variantKey]?.schritte,steps=useV?r0.var[variantKey].schritte:r0.schritte;
 const v=await ai("Extrahiere aus diesen Rezeptschritten alle Warte- und Garzeiten (Ofen, Kochen, Braten, Ruhen, Kühlen, Gehen lassen). "+JSON.stringify(steps)+' Antworte NUR als JSON: {"zeiten":[[{"l":string,"min":number}]]} mit genau '+steps.length+' Listen (pro Schritt eine, [] wenn nichts). l = kurze Bezeichnung wie "Ofen: Quiche backen", min = Minuten (obere Grenze bei Spannen).');
 const z=(v.zeiten||[]).slice(0,steps.length);while(z.length<steps.length)z.push([]);if(useV)r0.var[variantKey].zeiten=z;else r0.zeiten=z;save()}

async function aiTimesBtn(id){if(busy)return;busy=true;toast("KI liest die Zeiten …");try{await timesFor(id,sel);toast("Timer-Zeiten gespeichert ⏱")}catch(e){if(e.message!=="nokey")alert(e.message)}busy=false;render()}
async function aiTimesAll(){if(busy)return;const todo=S.rez.filter(r=>!Array.isArray(r.zeiten));if(!todo.length)return toast("Alle Rezepte haben schon Zeiten");
 busy=true;let n=0;try{for(const r of todo){toast("Zeiten "+(++n)+" von "+todo.length+" …");await timesFor(r.id,"orig")}toast("Fertig ✓ "+todo.length+" Rezepte")}catch(e){if(e.message!=="nokey")alert(e.message)}busy=false;render()}
function cookRender(){let o=document.getElementById("cook");if(!cook){o&&o.remove();tick();return}
 if(!o){o=document.createElement("div");o.id="cook";document.body.appendChild(o)}
 const r0=S.rez.find(x=>x.id===cook.id),r=current(r0),n=r.schritte.length,s=r.schritte[cook.i],k=(S.faktor[r0.id]||r0.por)/r0.por,ts=stepTimers(r,cook.i);
 o.innerHTML=`<div class="row"><b class="head">${esc(r.titel)}</b><button class="chip" onclick="cookEnd()">✕ Beenden</button></div><div class="mut">Schritt ${cook.i+1} von ${n}</div>
 <div class="cs">${esc(s)}</div>
 <div class="card">${ts.map((t,j)=>`<div class="row" style="margin-bottom:6px"><span>${esc(t.l)}</span><span><input type="text" inputmode="decimal" id="tmin${j}" value="${t.min}" style="width:64px;display:inline;text-align:center"> Min. <button class="btn" onclick="timerStart(${j})">▶</button></span></div>`).join("")}
 ${ts.length>1?`<button class="btn ghost" onclick="timerAll()">▶▶ Alle ${ts.length} starten</button> `:""}
 <div class="row"><span class="mut">Eigener Timer</span><span><input type="text" id="cl" placeholder="Name" style="width:90px;display:inline"> <input type="text" inputmode="decimal" id="cm" placeholder="Min." style="width:56px;display:inline"> <button class="btn ghost" onclick="addTimer($('#cl').value,$('#cm').value)">▶</button></span></div></div>
 <div id="tms">${timersHtml()}</div>
 <div class="row" style="margin-top:14px"><button class="btn ghost" ${cook.i?"":"disabled"} onclick="cook.i--;cookRender()">← Zurück</button><button class="btn ghost" onclick="cook.ing=!cook.ing;cookRender()">🥕 Zutaten</button><button class="btn" onclick="${cook.i<n-1?"cook.i++;cookRender()":"cookDone()"}">${cook.i<n-1?"Weiter →":"Fertig 🎉"}</button></div>
 ${Array.isArray(r.zeiten)?"":`<p><button class="btn ghost" ${cook.busy?"disabled":""} onclick="aiTimes()">${cook.busy?"KI liest …":"✨ Zeiten per KI aus dem Rezept erkennen"}</button></p>`}
 ${cook.ing?`<div class="card" style="margin-top:12px"><ul>${r.zutaten.map(z=>`<li>${z.m!=null?fmt(z.m*k)+" "+esc(z.e)+" ":""}${esc(z.n)}</li>`).join("")}</ul></div>`:""}`}
/* ---------- Wochenplan ---------- */
const TAGE=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
function weekView(){const p=S.plan;return `<div class="card"><b class="head">📅 Wochenplan</b>
 <div class="row" style="margin:6px 0"><span>Anzahl Tage</span><div class="step"><button onclick="S.plan.n=Math.max(1,S.plan.n-1);save();render()">−</button><span>${p.n}</span><button onclick="S.plan.n=Math.min(7,S.plan.n+1);save();render()">+</button></div></div>
 <input type="text" id="wish" placeholder="Wünsche, z. B. 2× vegetarisch, 1× Fisch, unter der Woche schnell" value="${esc(p.wish)}">
 <label style="display:block;margin:6px 0"><input type="checkbox" ${p.neu?"checked":""} onchange="S.plan.neu=this.checked;save()"> KI darf neue Ideen ergänzen</label>
 <button class="btn" onclick="planAI()">✨ Vorschlag von der KI</button> <button class="btn ghost" onclick="planLocal()">🎲 Aus meinem Buch mischen</button><div id="wst" class="note"></div></div>
 ${p.days.map((d,i)=>{const r=d.rid&&S.rez.find(x=>x.id===d.rid);return `<div class="card"><div class="mut">${TAGE[i]}</div><div class="row"><b class="head">${r?`<a href="#" style="color:inherit" onclick="tab='list';cur=${r.id};sel='orig';render();return false">${esc(r.titel)}</a>`:d.idee?esc(d.idee)+" <span class=mut>(Idee)</span>":"– frei –"}</b><span><button class="chip" onclick="planReroll(${i})">🎲</button> <button class="chip" onclick="S.plan.days[${i}]={};save();render()">✕</button></span></div>${d.grund?`<div class="mut">${esc(d.grund)}</div>`:""}${d.idee&&!r?`<button class="btn ghost" onclick="planGen(${i})">✨ Rezept dazu erzeugen</button>`:""}</div>`}).join("")}
 ${p.days.some(d=>d.rid)?`<p><button class="btn" onclick="planShop()">🛒 Zutaten der Woche auf die Einkaufsliste</button></p>`:""}`}
function planPick(n,ex){const pool=S.rez.filter(r=>!ex.includes(r.id)).sort(()=>Math.random()-.5),used={},out=[];
 while(out.length<n&&pool.length){let b=0,bs=1e9;pool.forEach((r,i)=>{const s=(r.kat||[]).reduce((a,c)=>a+(used[c]||0),0)+Math.random();if(s<bs){bs=s;b=i}});
  const r=pool.splice(b,1)[0];(r.kat||[]).forEach(c=>used[c]=(used[c]||0)+1);out.push(r)}return out}
function planLocal(){S.plan.wish=$("#wish").value;const rs=planPick(S.plan.n,[]);S.plan.days=Array.from({length:S.plan.n},(_,i)=>rs[i]?{rid:rs[i].id}:{});save();render()}
function planReroll(i){const used=S.plan.days.map(d=>d.rid).filter(Boolean),r=planPick(1,used)[0];S.plan.days[i]=r?{rid:r.id}:{};save();render()}
async function planAI(){if(busy)return;S.plan.wish=$("#wish").value;busy=true;$("#wst").textContent="KI plant die Woche …";
 try{const list=S.rez.map(r=>({rid:r.id,titel:r.titel,kategorien:r.kat,minuten:r.aktiv||null,gekocht:(r.cooked||[]).length,sterne:r.stars||0}));
  const v=await ai("Plane "+S.plan.n+" Abendessen für eine Familie. Sorge für Abwechslung und Ausgewogenheit (Gemüse, Fleisch/Fisch/vegetarisch gemischt, schnelle und aufwändigere Gerichte verteilen, nicht zwei ähnliche hintereinander). Wünsche: "+(S.plan.wish||"keine")+". Meine Rezepte: "+JSON.stringify(list)+". "+(S.plan.neu?"Nutze vorrangig meine Rezepte (rid), ergänze höchstens "+Math.ceil(S.plan.n/3)+" neue Ideen (rid null, idee = Gerichtname).":"Nutze ausschließlich meine Rezepte, kein Rezept doppelt, wenn genug vorhanden.")+' Antworte NUR als JSON: {"tage":[{"rid":number oder null,"idee":string oder null,"grund":string (kurz)}]} mit genau '+S.plan.n+" Einträgen.");
  const ids=new Set(S.rez.map(r=>r.id));S.plan.days=(v.tage||[]).slice(0,S.plan.n).map(t=>ids.has(t.rid)?{rid:t.rid,grund:t.grund}:(S.plan.neu&&t.idee?{idee:t.idee,grund:t.grund}:{}));save()}
 catch(e){if(e.message!=="nokey")alert("Planung fehlgeschlagen: "+e.message)}busy=false;render()}
async function planGen(i){if(busy)return;busy=true;toast("Rezept wird erstellt …");try{const r=await generateRecipe(S.plan.days[i].idee);S.plan.days[i]={rid:r.id,grund:S.plan.days[i].grund};save()}catch(e){if(e.message!=="nokey")alert(e.message)}busy=false;render()}
function planShop(){S.plan.days.filter(d=>d.rid).forEach(d=>addShop(d.rid,false));save();toast("Zutaten hinzugefügt");tab="shop";render()}
/* ---------- Sync (privates GitHub-Repo) ---------- */
let syncing=false,syncT=null;
const hsh=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)};
const b64e=s=>{const b=new TextEncoder().encode(s);let t="";b.forEach(c=>t+=String.fromCharCode(c));return btoa(t)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
function schedSync(){if(!S.gh||!S.ghRepo)return;clearTimeout(syncT);syncT=setTimeout(()=>sync(false),4000)}
function setSt(t){S.syncSt=t;const e=document.getElementById("syncst");if(e)e.textContent=t+(S.syncAt?" · zuletzt "+new Date(S.syncAt).toLocaleString("de-DE"):"")}
async function gh(method,body){const U="https://api.github.com/repos/"+S.ghRepo+"/contents/kochbuch.json";const r=await fetch(U+(method==="GET"?"?t="+Date.now():""),
 {method,headers:{Authorization:"Bearer "+S.gh,Accept:"application/vnd.github+json",...(body?{"Content-Type":"application/json"}:{})},cache:"no-store",body:body?JSON.stringify(body):undefined});
 if(method==="GET"&&r.status===404)return{data:null,sha:null};
 if(r.status===401)throw new Error("Zugangsschlüssel ungültig oder abgelaufen (401).");
 if(r.status===403||r.status===404)throw new Error("Kein Zugriff auf das Repo ("+r.status+"). Name und Rechte des Schlüssels prüfen.");
 if(method==="PUT"&&(r.status===409||r.status===422))return{conflict:true};
 if(!r.ok)throw new Error("GitHub "+r.status);
 const j=await r.json();if(method!=="GET")return{ok:true};
 let txt;if(j.content)txt=b64d(j.content);else{const rr=await fetch(U+"?t="+Date.now(),{headers:{Authorization:"Bearer "+S.gh,Accept:"application/vnd.github.raw+json"},cache:"no-store"});if(!rr.ok)throw new Error("GitHub "+rr.status);txt=await rr.text()}
 return{data:JSON.parse(txt),sha:j.sha}}
function computeMeta(){S.rez.forEach(r=>{const hh=hsh(JSON.stringify(r)),m=S.meta[r.id];
  if(!m)S.meta[r.id]={h:hh,u:r.id>1e12?r.id:1};else if(m.h!==hh)S.meta[r.id]={h:hh,u:Date.now()}});
 const ch=hsh(JSON.stringify(S.cats));if(S.catsMeta.h===""){S.catsMeta={h:ch,u:0}}else if(S.catsMeta.h!==ch)S.catsMeta={h:ch,u:Date.now()}}
function merge(rem){rem=rem||{rez:[],cats:null,catsU:0,tomb:{}};
 const tomb={...(rem.tomb||{})};Object.entries(S.tomb).forEach(([k,v])=>tomb[k]=Math.max(tomb[k]||0,v));
 const L=Object.fromEntries(S.rez.map(r=>[r.id,r])),R=Object.fromEntries((rem.rez||[]).map(r=>[r.id,r]));
 const out=[],meta={};
 new Set([...Object.keys(L),...Object.keys(R)]).forEach(id=>{const l=L[id],r=R[id],lu=l?S.meta[id].u:0,ru=r?r.upd||0:0;
  if((tomb[id]||0)>Math.max(lu,ru))return;
  if(l&&lu>=ru){out.push(l);meta[id]={h:S.meta[id].h,u:lu}}
  else{const{upd,...rr}=r;out.push(rr);meta[id]={h:hsh(JSON.stringify(rr)),u:ru}}});
 out.sort((a,b)=>b.id-a.id);
 let cats=S.cats,catsU=S.catsMeta.u;
 if(rem.cats&&(S.syncAt===0||rem.catsU>catsU)){cats=rem.cats;catsU=rem.catsU||0}
 return{out,meta,tomb,cats,catsU}}
async function sync(manual){
 if(!S.gh||!S.ghRepo){if(manual)toast("Repo und Schlüssel eintragen");return}
 if(syncing)return;syncing=true;setSt("Synchronisiere …");
 try{let changed=false;
  for(let t=0;t<3;t++){const{data,sha}=await gh("GET");computeMeta();const m=merge(data);
   const before=JSON.stringify([S.rez,S.cats]);
   S.rez=m.out;S.meta=m.meta;S.tomb=m.tomb;S.cats=m.cats;ensureCats();
   S.catsMeta={h:hsh(JSON.stringify(S.cats)),u:m.catsU};
   if(JSON.stringify([S.rez,S.cats])!==before)changed=true;
   const payload={v:1,rez:S.rez.map(r=>({...r,upd:S.meta[r.id].u})),cats:S.cats,catsU:S.catsMeta.u,tomb:S.tomb};
   const same=data&&JSON.stringify(payload)===JSON.stringify({v:1,rez:(data.rez||[]),cats:data.cats,catsU:data.catsU,tomb:data.tomb||{}});
   if(same)break;
   const res=await gh("PUT",{message:"Sync "+new Date().toISOString(),content:b64e(JSON.stringify(payload)),...(sha?{sha}:{})});
   if(!res.conflict)break;if(t===2)throw new Error("Gleichzeitige Änderung, bitte nochmal versuchen.")}
  S.syncAt=Date.now();S.syncSt="Synchronisiert ✓";rawSave();
  if(manual)toast("Synchronisiert ✓");
  if(changed&&!document.activeElement?.matches?.("input,textarea"))render();else setSt(S.syncSt)
 }catch(e){S.syncSt="Fehler: "+e.message;rawSave();if(manual)alert(S.syncSt);setSt(S.syncSt)}
 syncing=false}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")schedSync()});
applyTheme();render();schedSync();
if("serviceWorker"in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl||!navigator.serviceWorker.controller)return;rl=true;location.reload()})}
</script></body></html>
